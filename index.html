<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
name="theme-color"
content="#08080c"
>

<meta
name="apple-mobile-web-app-capable"
content="yes"
>

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent"
>

<meta
name="apple-mobile-web-app-title"
content="ConvMed"
>

<meta
name="description"
content="Convertisseur simple EUR, IDR et MYR."
>

<link rel="manifest" href="manifest.json">

<link
rel="apple-touch-icon"
href="icon.png"
>

<link
rel="stylesheet"
href="style.css"
>

<title>ConvMed</title>
</head>

<body>

<main class="container">

<!-- HEADER -->
<header class="header">

<img
src="icon.png"
alt="ConvMed"
class="logo"
>

<h1>ConvMed</h1>

<p class="subtitle">
Convertisseur de devises
</p>

</header>


<!-- DEVISE DE DÉPART -->
<section class="card">

<div class="currency-row">

<div class="currency-info">

<div
class="currency-flag"
id="fromFlag"
>
🇪🇺
</div>

<div>
<div
class="currency-code"
id="fromCode"
>
EUR
</div>

<div
class="currency-name"
id="fromName"
>
Euro
</div>
</div>

</div>

<div
class="currency-symbol"
id="fromSymbol"
>
€
</div>

</div>


<label
class="amount-label"
for="amount"
>
Montant
</label>

<input
id="amount"
class="amount-input"
type="number"
inputmode="decimal"
value="100"
min="0"
step="any"
placeholder="0"
>

<div style="margin-top:16px;">

<select id="fromSelect">
<option value="EUR">🇪🇺 EUR — Euro</option>
<option value="IDR">🇮🇩 IDR — Roupie indonésienne</option>
<option value="MYR">🇲🇾 MYR — Ringgit malaisien</option>
</select>

</div>

</section>


<!-- BOUTON INVERSER -->
<button
id="swap"
class="swap"
type="button"
aria-label="Inverser les devises"
title="Inverser les devises"
>
⇅
</button>


<!-- DEVISE D'ARRIVÉE -->
<section class="card">

<div class="currency-row">

<div class="currency-info">

<div
class="currency-flag"
id="toFlag"
>
🇮🇩
</div>

<div>

<div
class="currency-code"
id="toCode"
>
IDR
</div>

<div
class="currency-name"
id="toName"
>
Roupie indonésienne
</div>

</div>

</div>

<div
class="currency-symbol"
id="toSymbol"
>
Rp
</div>

</div>


<div style="margin-top:16px;">

<select id="toSelect">
<option value="EUR">🇪🇺 EUR — Euro</option>
<option value="IDR" selected>🇮🇩 IDR — Roupie indonésienne</option>
<option value="MYR">🇲🇾 MYR — Ringgit malaisien</option>
</select>

</div>

</section>


<!-- RÉSULTAT -->
<section class="card result-card">

<div
id="result"
class="result"
>
—
</div>

<div
id="rate"
class="rate"
>
Taux de change : —
</div>

<div
id="updated"
class="updated"
>
Mise à jour en cours…
</div>

</section>


<!-- MONTANTS RAPIDES -->
<section class="card">

<div class="currency-row">

<div>
<div class="currency-code">
Montants rapides
</div>

<div class="currency-name">
Appuie pour convertir
</div>
</div>

</div>


<div class="quick">

<button
type="button"
data-value="10"
>
10 €
</button>

<button
type="button"
data-value="20"
>
20 €
</button>

<button
type="button"
data-value="50"
>
50 €
</button>

<button
type="button"
data-value="100"
>
100 €
</button>

</div>

</section>


<!-- ACTUALISATION -->
<button
id="refresh"
type="button"
>
↻ Actualiser le taux
</button>


<!-- MESSAGE D'ERREUR -->
<div id="error"></div>

</main>


<!-- JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
